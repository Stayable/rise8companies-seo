<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../styles.css" />
<style>

  .col img { display: block; image-rendering: auto; }
  .cap { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
  <div class="col"><img src="../assets/favicon/favicon-512.png" width="120" height="120" alt="512" /><div class="cap">512</div></div>
  <div class="col"><img src="../assets/favicon/apple-touch-icon.png" width="72" height="72" alt="180" /><div class="cap">180 · apple</div></div>
  <div class="col"><img src="../assets/favicon/favicon-48.png" width="48" height="48" alt="48" /><div class="cap">48</div></div>
  <div class="col"><img src="../assets/favicon/favicon-32.png" width="32" height="32" alt="32" /><div class="cap">32</div></div>
  <div class="col"><img src="../assets/favicon/favicon-16.png" width="16" height="16" alt="16" /><div class="cap">16</div></div>
</body>
</html>
