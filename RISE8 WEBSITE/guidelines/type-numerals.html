<!-- @dsCard group="Type" viewport="700x180" name="Numerals as device" subtitle="Serif stat figures, index numbers, Roman numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper-2); padding: 26px 32px; display: flex; align-items: flex-end; gap: 48px; }
  .stat .v { font-family: var(--serif); font-weight: 500; font-size: 64px; line-height: .9; letter-spacing: -.02em; color: var(--ink); }
  .stat .v sup { color: var(--accent); font-size: .5em; vertical-align: .6em; margin-left: 2px; }
  .stat .l { font: var(--label-sm); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .idx { font-family: var(--serif); font-weight: 500; color: var(--accent); letter-spacing: -.02em; }
  .idx .n { font-size: 40px; display: block; }
  .roman { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--accent); letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="stat"><div class="v">1,300<sup>+</sup></div><div class="l">Keys managed</div></div>
  <div class="stat"><div class="v">100<sup>%</sup></div><div class="l">Stayable branded</div></div>
  <div class="idx"><span class="n">01</span></div>
  <div class="roman">I · II · III · IV · V</div>
</body>
</html>
