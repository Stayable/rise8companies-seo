<!-- @dsCard group="Colors" viewport="700x150" name="Navy & rules" subtitle="Inverted dark surface + hairline divider tones" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper); }
  .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .sw { padding: 22px 16px 16px; min-height: 116px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; }
  .hex { font-family: var(--serif); font-size: 17px; margin-top: 4px; }
  .var { font: 500 10px var(--sans); margin-top: 2px; opacity: .7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--navy)"><div class="name" style="color:var(--accent)">Navy</div><div class="hex" style="color:var(--navy-text)">#1F2126</div><div class="var" style="color:var(--navy-text)">--navy · inverted</div></div>
    <div class="sw" style="background: var(--rule)"><div class="name" style="color:var(--ink)">Rule</div><div class="hex" style="color:var(--ink)">#B4BBC4</div><div class="var" style="color:var(--ink-2)">--rule</div></div>
    <div class="sw" style="background: var(--rule-soft)"><div class="name" style="color:var(--ink)">Rule soft</div><div class="hex" style="color:var(--ink)">#CDD2DA</div><div class="var" style="color:var(--ink-2)">--rule-soft</div></div>
  </div>
</body>
</html>
