<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base · editorial rhythm to 176px sections" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper); padding: 26px 32px; }
  .meta { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  .scale { display: flex; align-items: flex-end; gap: 10px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 18px; background: var(--accent); }
  .lbl { font: 500 9px var(--sans); color: var(--muted); }
</style>
</head>
<body>
  <div class="meta">--space-1 … --space-20 &nbsp;·&nbsp; section padding 72 / 120 / 176</div>
  <div class="scale">
    <div class="step"><div class="bar" style="height:4px"></div><div class="lbl">4</div></div>
    <div class="step"><div class="bar" style="height:8px"></div><div class="lbl">8</div></div>
    <div class="step"><div class="bar" style="height:12px"></div><div class="lbl">12</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="lbl">16</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="lbl">24</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="lbl">32</div></div>
    <div class="step"><div class="bar" style="height:40px"></div><div class="lbl">40</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="lbl">48</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="lbl">64</div></div>
    <div class="step"><div class="bar" style="height:80px"></div><div class="lbl">80</div></div>
  </div>
</body>
</html>
