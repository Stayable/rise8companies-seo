<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 124px; }
  .light { background: var(--paper); }
  .dark { background: var(--navy); }
  img { height: 84px; width: auto; display: block; }
</style>
</head>
<body>
  <div class="cell light"><img src="../assets/logos/rise8-logo-navy.png" alt="RISE8 Companies" /></div>
  <div class="cell dark"><img src="../assets/logos/rise8-logo-light.png" alt="RISE8 Companies" /></div>
</body>
</html>
