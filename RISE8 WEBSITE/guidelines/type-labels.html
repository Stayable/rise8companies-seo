<!-- @dsCard group="Type" viewport="700x200" name="Labels — Inter" subtitle="Uppercase, letter-spaced. Labels only — never body." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper); padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .meta { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted-2); }
  .lg { font: var(--label-lg); letter-spacing: var(--track-label-wide); text-transform: uppercase; color: var(--muted); }
  .md { font: var(--label-md); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink); }
  .sm { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted); }
  .dot { color: var(--accent); margin: 0 8px; }
</style>
</head>
<body>
  <div class="meta">Inter 500 · uppercase · tracking .22–.28em</div>
  <div class="lg">02 <span class="dot">·</span> Our platform &nbsp;&nbsp;— label-lg 11px</div>
  <div class="md">Investor login &nbsp;&nbsp;— label-md 10px</div>
  <div class="sm">I-4 corridor &nbsp;&nbsp;— label-sm 9px (tags)</div>
</body>
</html>
