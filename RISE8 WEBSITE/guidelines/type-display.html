<!-- @dsCard group="Type" viewport="700x260" name="Display — EB Garamond" subtitle="Serif headlines, weight 500, italic accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper); padding: 28px 32px; }
  .meta { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .h1 { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: .98; letter-spacing: -.012em; color: var(--ink); margin: 0 0 18px; }
  .h1 em { font-style: italic; color: var(--accent); font-weight: 500; }
  .h2 { font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1.02; letter-spacing: -.01em; color: var(--ink); margin: 0; }
  .h2 em { font-style: italic; color: var(--accent); }
</style>
</head>
<body>
  <div class="meta">Display · clamp(48–96) · 500 · −0.012em</div>
  <h1 class="h1">Extended-stay hospitality, <em>end to end.</em></h1>
  <h2 class="h2">One platform. <em>Every incentive</em> aligned.</h2>
</body>
</html>
