<!-- @dsCard group="Brand" viewport="700x190" name="Geometric marks" subtitle="Hairline squares hold initials; circular compass & pins" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--paper); padding: 30px 36px; display: flex; align-items: center; gap: 40px; }
  .mark { width: 64px; height: 64px; border: .5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--accent); letter-spacing: -.02em; }
  .compass { width: 56px; height: 56px; border: .5px solid var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink); }
  .pin { width: 12px; height: 12px; background: var(--accent); border: 1px solid var(--ink); border-radius: 50%; }
  .cap { font: var(--label-sm); letter-spacing: var(--track-label-tight); text-transform: uppercase; color: var(--muted); margin-top: 8px; text-align: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div class="col"><div class="mark">R8</div><div class="cap">Footer mark</div></div>
  <div class="col"><div class="mark">EH</div><div class="cap">Everybody's Home</div></div>
  <div class="col"><div class="compass">N</div><div class="cap">Compass</div></div>
  <div class="col"><div class="pin"></div><div class="cap">Map pin</div></div>
</body>
</html>
