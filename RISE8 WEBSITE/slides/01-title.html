<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" subtitle="Navy cover — wordmark, serif title, proverb" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--navy); color: var(--paper); display: flex; flex-direction: column; }
  .slide-bg { position: absolute; inset: 0; background:
    radial-gradient(ellipse at 28% 38%, rgba(77,200,211,.16), transparent 60%),
    radial-gradient(ellipse at 72% 72%, rgba(31,33,38,.7), transparent 55%),
    linear-gradient(160deg, #1D1F24 0%, #25282E 55%, #2E3138 100%); }
  .slide-bg::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; opacity: .5; }
  .inner { position: relative; flex: 1; padding: 72px 88px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .top img { height: 64px; }
  .proverb { text-align: right; font-family: var(--serif); font-style: italic; color: rgba(227,227,227,.55); font-size: 17px; }
  .proverb b { display: block; font-style: normal; font-weight: 500; color: var(--accent); font-size: 15px; letter-spacing: .05em; margin-bottom: 4px; }
  .mid { margin-top: auto; }
  .eyebrow { font: 500 13px var(--sans); letter-spacing: .3em; text-transform: uppercase; color: rgba(227,227,227,.55); margin-bottom: 28px; }
  .eyebrow .dot { color: var(--accent); margin: 0 10px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 88px; line-height: 1.0; letter-spacing: -.015em; color: var(--navy-text); margin: 0; max-width: 20ch; }
  h1 em { font-style: italic; color: var(--accent); }
  .sub { font-family: var(--serif); font-style: italic; font-size: 24px; color: rgba(227,227,227,.72); margin: 28px 0 0; max-width: 60ch; }
  .rule { height: 1px; background: rgba(227,227,227,.2); margin-top: 40px; }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-bg"></div>
  <div class="inner">
    <div class="top">
      <img src="../assets/logos/rise8-logo-light.png" alt="RISE8 Companies" />
      <div class="proverb"><b>七転び八起き</b>Nana korobi yaoki.</div>
    </div>
    <div class="mid">
      <div class="eyebrow">Investor briefing <span class="dot">·</span> Q2 2026</div>
      <h1>Extended-stay hospitality, <em>end to end.</em></h1>
      <p class="sub">One parent. Four operating companies. Eight Florida properties. A single integrated platform.</p>
      <div class="rule"></div>
    </div>
  </div>
</div>
</body>
</html>
